#
# this is an example nginx config for Zammad
# Please visit https://docs.zammad.org for further input on how to configure
# your nginx to work with Zammad
#
# This is a NON SSL configuration, DO NOT use in production!
#

# Real upstream + keepalive pool for regular HTTP traffic to railsserver
# (used by `location /` below), resolved once via the system resolver at
# nginx startup - which, unlike nginx's own `resolver` directive, honors
# /etc/resolv.conf's search domains, so the bare short name resolves
# correctly with no platform-specific FQDN needed. The dynamic-resolver
# workaround (opening a fresh, unpooled connection per request - see
# /cable below, which still needs it) was found to intermittently
# truncate larger responses under proxying (e.g. /api/v1/signshow's
# frontend config payload; nginx error log: "upstream prematurely closed
# connection while reading upstream"), root-caused to the lack of
# connection reuse - same class of issue already fixed for Grafana below.
# /cable keeps the dynamic-resolver workaround since it's a long-lived
# Action Cable connection, not many short-lived requests, so it doesn't
# hit the same truncation issue and doesn't need pooling the same way.
upstream zammad-railsserver {
  server zammad-railsserver;
  keepalive 16;
}

upstream zammad-websocket {
  server zammad-websocket;
}

# Grafana runs a single, stable replica, so the same static upstream +
# keepalive approach as railsserver above applies here too - see the
# comment there for the full reasoning.
upstream zammad-grafana {
  server zammad-grafana;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;

  # replace 'localhost' with your fqdn if you want to use zammad from remote
  server_name localhost;

  # security - prevent information disclosure about server version
  server_tokens off;

  root /opt/zammad/public;

  access_log /var/log/nginx/zammad.access.log;
  error_log  /var/log/nginx/zammad.error.log;

  client_max_body_size 50M;

  location ~ ^/(assets/|robots.txt|humans.txt|favicon.ico|apple-touch-icon.png) {
    expires max;
  }

  # legacy web socket server
  location /ws {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    # Host is intentionally the static app name here, NOT substituted by
    # the docker entrypoint (unlike the proxy_pass target below, which is
    # rewritten from ZAMMAD_WEBSOCKET_HOST/PORT). Some platforms, e.g. Azure
    # Container Apps, route internal service-to-service traffic based on
    # the Host header and expect the app's plain short name there, even
    # when a different, platform-specific DNS name was needed to actually
    # reach it. The original request's Host is preserved separately below.
    proxy_set_header Host zammad-websocket;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header CLIENT_IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_pass http://zammad-websocket;
  }

  # action cable
  location /cable {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    # See the /ws block above for why Host and X-Forwarded-Host are split.
    proxy_set_header Host zammad-railsserver;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header CLIENT_IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    # Deliberately not "http://zammad-railsserver;" - that now refers to
    # the real upstream block above (used by `location /`), which
    # doesn't get the dynamic-resolver substitution below. This is just a
    # sed-matchable placeholder, never actually resolved directly.
    proxy_pass http://zammad-railsserver-cable;
  }

  # Grafana (Zammad ticket/SLA reporting), served from a subpath so it
  # doesn't need its own subdomain/TLS cert. Requires Grafana configured
  # with GF_SERVER_SERVE_FROM_SUB_PATH=true and a matching GF_SERVER_ROOT_URL
  # (no path stripped here — Grafana expects to see /analytics/ in the
  # request path itself when served from a sub path). Named /analytics/
  # rather than /grafana/ since end users shouldn't need to know or care
  # which product renders the reporting UI.
  location /analytics/ {
    proxy_http_version 1.1;
    # Required for the upstream keepalive pool above to actually be used —
    # without clearing Connection, nginx signals Connection: close to the
    # backend on every request, defeating the pool.
    proxy_set_header Connection "";
    # See the /ws block above for why Host and X-Forwarded-Host are split.
    proxy_set_header Host zammad-grafana;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://zammad-grafana;
  }

  location / {
    proxy_http_version 1.1;
    # See the /ws block above for why Host and X-Forwarded-Host are split.
    proxy_set_header Host zammad-railsserver;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header CLIENT_IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Change this line in an SSO setup
    proxy_set_header X-Forwarded-User "";
    # Required for the upstream keepalive pool above to actually be used —
    # without clearing Connection, nginx signals Connection: close to the
    # backend on every request, defeating the pool.
    proxy_set_header Connection "";

    proxy_read_timeout 300;
    proxy_pass http://zammad-railsserver;

    gzip on;
    gzip_types text/plain text/xml text/css image/svg+xml application/javascript application/x-javascript application/json application/xml;
    gzip_proxied any;
  }
}
