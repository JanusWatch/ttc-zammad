#
# this is an example nginx config for Zammad
# Please visit https://docs.zammad.org for further input on how to configure
# your nginx to work with Zammad
#
# This is a NON SSL configuration, DO NOT use in production!
#

# Real upstream blocks, resolved once via the system resolver at nginx
# startup - which, unlike nginx's own `resolver` directive, honors
# /etc/resolv.conf's search domains, so the bare short name resolves
# correctly with no platform-specific FQDN needed. An earlier version of
# this config used a dynamic-resolver workaround instead (opening a
# fresh, unpooled connection per request via a `set $var ...; proxy_pass
# $var;` pattern - see https://tenzer.dk/nginx-with-dynamic-upstreams/),
# on the assumption that railsserver/websocket's multiple replicas would
# get new IPs on reschedule. That assumption turned out to be wrong (the
# underlying address is stable regardless of replica count/rescheduling)
# and the workaround was actively harmful for regular HTTP traffic: it
# was found to intermittently truncate larger responses under proxying
# (e.g. /api/v1/signshow's frontend config payload; nginx error log:
# "upstream prematurely closed connection while reading upstream"),
# root-caused to the lack of connection reuse. websocket's upstream has
# no `keepalive` - Upgrade connections are long-lived and exclusive to
# one client, so pooling doesn't apply the same way it does for regular
# HTTP (see the /ws and /cable locations below, which set
# Connection: Upgrade rather than clearing it).
upstream zammad-railsserver {
  server zammad-railsserver;
  keepalive 16;
}

upstream zammad-websocket {
  server zammad-websocket;
}

# Grafana runs a single, stable replica, so the same static upstream +
# keepalive approach as railsserver above applies here too - see the
# comment there for the full reasoning.
upstream zammad-grafana {
  server zammad-grafana;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;

  # replace 'localhost' with your fqdn if you want to use zammad from remote
  server_name localhost;

  # security - prevent information disclosure about server version
  server_tokens off;

  root /opt/zammad/public;

  access_log /var/log/nginx/zammad.access.log;
  error_log  /var/log/nginx/zammad.error.log;

  client_max_body_size 50M;

  location ~ ^/(assets/|robots.txt|humans.txt|favicon.ico|apple-touch-icon.png) {
    expires max;
  }

  # legacy web socket server
  location /ws {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    # Host is the static app name, matching proxy_pass below (both use
    # the plain short name now - see the upstream block's comment at the
    # top of this file for why that resolves correctly). Some platforms,
    # e.g. Azure Container Apps, route internal service-to-service traffic
    # based on the Host header and expect the app's plain short name
    # there. The original request's Host is preserved separately below.
    proxy_set_header Host zammad-websocket;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header CLIENT_IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_pass http://zammad-websocket;
  }

  # action cable
  location /cable {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    # See the /ws block above for why Host and X-Forwarded-Host are split.
    proxy_set_header Host zammad-railsserver;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header CLIENT_IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_pass http://zammad-railsserver;
  }

  # Grafana (Zammad ticket/SLA reporting), served from a subpath so it
  # doesn't need its own subdomain/TLS cert. Requires Grafana configured
  # with GF_SERVER_SERVE_FROM_SUB_PATH=true and a matching GF_SERVER_ROOT_URL
  # (no path stripped here — Grafana expects to see /analytics/ in the
  # request path itself when served from a sub path). Named /analytics/
  # rather than /grafana/ since end users shouldn't need to know or care
  # which product renders the reporting UI.
  location /analytics/ {
    proxy_http_version 1.1;
    # Required for the upstream keepalive pool above to actually be used —
    # without clearing Connection, nginx signals Connection: close to the
    # backend on every request, defeating the pool.
    proxy_set_header Connection "";
    # See the /ws block above for why Host and X-Forwarded-Host are split.
    proxy_set_header Host zammad-grafana;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://zammad-grafana;
  }

  location / {
    proxy_http_version 1.1;
    # See the /ws block above for why Host and X-Forwarded-Host are split.
    proxy_set_header Host zammad-railsserver;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header CLIENT_IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Change this line in an SSO setup
    proxy_set_header X-Forwarded-User "";
    # Required for the upstream keepalive pool above to actually be used —
    # without clearing Connection, nginx signals Connection: close to the
    # backend on every request, defeating the pool.
    proxy_set_header Connection "";

    proxy_read_timeout 300;
    proxy_pass http://zammad-railsserver;

    gzip on;
    gzip_types text/plain text/xml text/css image/svg+xml application/javascript application/x-javascript application/json application/xml;
    gzip_proxied any;
  }
}
